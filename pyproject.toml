[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postlikeme"
version = "0.1.0"
description = "Analyze X/Twitter accounts and generate style-matched tweets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "tweepy>=4.14",
    "anthropic>=0.40",
    "openai>=1.50",
    "spacy>=3.7",
    "textstat>=0.7",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "httpx>=0.27",
    "emoji>=2.0",
    "vaderSentiment>=3.3",
    "lexicalrichness>=0.5",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
scraping = ["twscrape>=0.12"]
embeddings = ["sentence-transformers>=3.0", "bertopic>=0.16"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]
all = ["postlikeme[scraping,embeddings,dev]"]

[project.scripts]
postlikeme = "postlikeme.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postlikeme"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
